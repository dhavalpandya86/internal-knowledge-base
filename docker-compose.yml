# Postgres for local / company-server self-hosting.
# `docker compose up -d` then `npm run db:push && npm run db:seed`.
services:
  db:
    image: postgres:16-alpine
    container_name: ikb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ikb
      POSTGRES_PASSWORD: ikb_password
      POSTGRES_DB: internal_kb
    ports:
      - "5432:5432"
    volumes:
      - ikb_pgdata:/var/lib/postgresql/data

volumes:
  ikb_pgdata:
